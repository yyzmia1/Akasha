upstream pocketbase {
    server pocketbase:8090;
    keepalive 32;
}

# 动态校验 AI 代理目标地址：
# 1. 允许任意合法的公网标准 HTTPS 域名（支持各种第三方中转站、OneAPI、官方接口等）
# 2. 严厉拦截私有内网 IP、Localhost、Docker 容器名和云厂商元数据地址（防 SSRF）
map_hash_bucket_size 128;
map $http_x_target_url $is_safe_ai_target {
    default 0;

    # 优先拦截危险目标 (返回 0)
    # 封杀 Localhost 与本地回环
    "~*https?://(localhost|127\.|0\.0\.0\.0)" 0;
    
    # 封杀内网私有网段（10.x, 192.168.x, 172.16-31.x）和云服务器 Metadata IP (169.254.x)
    "~*https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.|169\.254\.)" 0;
    
    # 封杀 Docker 同网络内部容器主机名（防止嗅探内网其他容器）
    "~*https?://(pocketbase|akasha|gzctf|app-stack)" 0;

    # 合法的公网 HTTPS 目标 (返回 1)：必须以 https:// 开头且带有顶级域名后缀
    "~*^https://[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}(/.*)?$" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.json {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Docker internal DNS for dynamic upstream resolution (e.g. AI proxy)
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /_ai_auth {
        internal;
        proxy_pass http://pocketbase/api/collections/users/auth-refresh;
        proxy_method POST;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_x_akasha_token;
    }

    # Provider credentials remain separate from the Akasha login token.
    location = /api/ai-proxy/chat/completions {
        if ($http_x_akasha_token = "") {
            return 401 '{"error":"Unauthorized: Missing Akasha token"}';
        }
        if ($is_safe_ai_target = 0) {
            return 403 '{"error":"Forbidden: Only public HTTPS domain targets are allowed"}';
        }
        if ($request_method != POST) {
            return 405 '{"error":"Method Not Allowed"}';
        }
        auth_request /_ai_auth;
        proxy_pass $http_x_target_url;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header X-Akasha-Token "";
        proxy_set_header X-Target-Url "";
        proxy_pass_request_body on;

        # Disable buffering for real-time SSE streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ai-proxy/ {
        return 404;
    }

    # PocketBase API and Realtime SSE
    location /api/ {
        proxy_pass http://pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE (Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # PocketBase Admin Dashboard
    location /_/ {
        proxy_pass http://pocketbase;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|avif|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

